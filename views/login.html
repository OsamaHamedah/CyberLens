<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Cyber Lens</title>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="centered-body">

<div class="container">
    <h2>Login to Cyber Lens</h2>
    <form action="../controllers/login.php" method="post">
        <input type="email" name="email" placeholder="Email Address" required aria-label="Email Address">
        <input type="password" name="password" placeholder="Password" required aria-label="Password">

        <div style="margin-bottom: 15px; text-align: left; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" name="is_admin" id="is_admin" style="width: auto; margin: 0;">
            <label for="is_admin" style="color: #efc07b; font-size: 0.9em; cursor: pointer;">Login as Administrator</label>
        </div>

        <button type="submit" name="login_btn">Login</button>
        <a href="../index.php?guest=true" class="guest-btn">Continue as Guest</a>
    </form>
    <div class="footer-link">
        Don't have an account? <a href="register.html">Sign Up</a>
    </div>
</div>
</body>
</html>
